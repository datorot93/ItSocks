version: '3.8'
services:
  nginx:
    image: nginx:1.17
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    depends_on:
      - backend

  postgres:
    image: postgres:12
    restart: always
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data:cached
      - ./.docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh

  laravel:
    build:
      context: itsocks-laravel
      dockerfile: Dockerfile
    env_file:
      - .env
      - itsocks-laravel/.env
    environment:
      DB_HOST: postgres
      DB_DATABASE: itsocks_laravel
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '8090:8090'
    volumes:
      - ./itsocks-laravel:/app:cached
    depends_on:
      - 'postgres'
  
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV-false}
    command: python app/main.py
    tty: true
    env_file:
      - .env
    ports:
      - '8000:8888'
    volumes:
      - ./backend:/app/:cached
      - ./.docker/.ipython:/root/.ipython:cached
    environment:
      PYTHONPATH: .
    depends_on:
      - 'postgres'

volumes:
  db-data: